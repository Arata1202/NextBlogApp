root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd"
  entrypoint = ["./tmp/main"]
  delay = 500
  include_dir = ["api", "cmd", "pkg"]
  include_ext = ["go"]
  exclude_regex = ["_test.go"]
  exclude_unchanged = true
  send_interrupt = true
  kill_delay = "500ms"
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
