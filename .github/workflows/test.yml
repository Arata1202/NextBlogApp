name: Test
on:
  pull_request:
  push:
    branches:
      - master
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  js:
    name: JS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Test OneSignal notification script
        env:
          ONESIGNAL_APP_ID: 00000000-0000-0000-0000-000000000000
          BASE_URL: https://realunivlog.com
        run: |
          bash -n scripts/send-onesignal-test-notifications.sh
          scripts/send-onesignal-test-notifications.sh --dry-run >/dev/null
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test:run
      - name: Build Storybook
        run: pnpm build-storybook
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Test Storybook
        run: pnpm test:storybook
      - name: E2E
        run: pnpm test:e2e
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
